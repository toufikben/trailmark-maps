name: build-pack

# Builds one offline MBTiles pack for a region and publishes it (plus a
# manifest.json) to the rolling `maps-latest` release. Trigger by hand.
on:
  workflow_dispatch:
    inputs:
      area:
        description: 'Geofabrik extract path, e.g. africa/algeria'
        required: true
        default: 'africa/algeria'
      pack_id:
        description: 'Stable id used in the file name and manifest'
        required: true
        default: 'dz-alger'
      pack_name:
        description: 'Human name shown in the app'
        required: true
        default: 'Alger'
      bounds:
        description: 'west,south,east,north (blank = whole extract)'
        required: false
        default: ''
      max_zoom:
        description: 'Zoom ceiling'
        required: false
        default: '14'
      min_mb:
        description: 'Reject the pack when the archive is smaller than this (MB). 0 disables the gate.'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: maps-release
  cancel-in-progress: false

env:
  PLANETILER_VERSION: v0.10.2
  PLANETILER_SHA256: f310bd0413e2e4512b27f4046d418664e8e1d3bf31603c2a70e23de06c167e4d

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch planetiler and the OSM extract
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o planetiler.jar \
            "https://github.com/onthegomap/planetiler/releases/download/$PLANETILER_VERSION/planetiler.jar"
          echo "$PLANETILER_SHA256  planetiler.jar" | sha256sum -c -
          AREA="${{ inputs.area }}"
          curl -sSfL -o area.osm.pbf "https://download.geofabrik.de/$AREA-latest.osm.pbf"
          echo "osm.pbf: $(stat -c %s area.osm.pbf) bytes"

      - name: Build MBTiles
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          bounds='${{ inputs.bounds }}'
          args=(--osm-path=area.osm.pbf --output='${{ inputs.pack_id }}.pmtiles'
                --maxzoom='${{ inputs.max_zoom }}' --force --threads=4 --download)
          if [ -n "$bounds" ]; then args+=(--bounds="$bounds"); fi
          echo "planetiler args: ${args[*]}"
          java -Xmx8g -jar planetiler.jar "${args[@]}" 2>&1 | tail -40
          SIZE=$(stat -c %s '${{ inputs.pack_id }}.pmtiles')
          MIN_MB='${{ inputs.min_mb }}'
          MIN=$((MIN_MB * 1024 * 1024))
          echo "archive bytes: $SIZE (quality gate: ${MIN_MB}MB)"
          if [ "$SIZE" -lt "$MIN" ]; then
            echo "::error::Pack is $SIZE bytes, below the ${MIN_MB}MB gate. Check area/bounds; set min_mb=0 only for intentionally tiny areas."
            exit 1
          fi

      - name: Write the manifest (merge this pack into the catalogue)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          R="${{ github.repository }}"
          ID='${{ inputs.pack_id }}'
          NAME='${{ inputs.pack_name }}'
          FILE="$ID.pmtiles"
          SIZE=$(stat -c %s "$FILE")
          SHA=$(sha256sum "$FILE" | awk '{print $1}')
          URL="https://github.com/$R/releases/download/maps-latest/$FILE"
          gh release download maps-latest --repo "$R" --pattern manifest.json --dir . --clobber >/dev/null 2>&1 || true
          [ -s manifest.json ] || echo '{"version":1,"packs":[]}' > manifest.json
          BOUNDS='${{ inputs.bounds }}'
          jq --arg id "$ID" --arg name "$NAME" --arg url "$URL" --argjson size "$SIZE" \
            --arg sha "$SHA" --arg bounds "$BOUNDS" \
            '.packs = (((.packs // []) | map(select(.id != $id))) + [{"id":$id,"name":$name,"kind":"map","url":$url,"sizeBytes":$size,"sha256":$sha,"bounds":$bounds}]) | .version = 1' \
            manifest.json > manifest.new.json
          mv manifest.new.json manifest.json
          cat manifest.json

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          R="${{ github.repository }}"
          gh release create maps-latest --repo "$R" --title "Map packs" \
            --notes "Rolling offline map packs - every run replaces these files." || true
          gh release upload maps-latest --repo "$R" '${{ inputs.pack_id }}.pmtiles' manifest.json --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.pack_id }}-pmtiles
          path: ${{ runner.temp }}/${{ inputs.pack_id }}.pmtiles
          retention-days: 7
